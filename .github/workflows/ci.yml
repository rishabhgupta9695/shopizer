name: CI

on:
  push:
    branches: [ "rishabh-workshop", "main" ]
  pull_request:
    branches: [ "rishabh-workshop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: SALESMANAGER
          MYSQL_USER: shopizer
          MYSQL_PASSWORD: shopizer-password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw clean install -DskipTests

      - name: Run unit tests
        run: ./mvnw test -pl sm-shop -Dtest="DateUtilTest,FileNameUtilsTest,SanitizeUtilsTest,GeoLocationUtilsTest,BeanUtilsTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run integration tests
        env:
          SPRING_PROFILES_ACTIVE: default
        run: ./mvnw test -pl sm-shop -Dtest="CategoryManagementAPIIntegrationTest,ProductManagementAPIIntegrationTest,ShoppingCartAPIIntegrationTest,CustomerRegistrationIntegrationTest,MerchantStoreApiIntegrationTest,UserApiIntegrationTest,ActuatorTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-jar
          path: sm-shop/target/shopizer.jar
          retention-days: 7
